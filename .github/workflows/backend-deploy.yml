name: Backend - Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend.Tests/**'

env:
  AZURE_WEBAPP_NAME: bugtracker-api-aharon
  DOTNET_VERSION: '8.0.x'

# ברירת המחדל של GITHUB_TOKEN יכולה להיות רחבה יותר ממה שהוורקפלואו הזה
# בפועל צריך - אין כאן אף שלב שכותב ל-repo (לא יוצר release, לא דוחף
# commit, לא פותח issue). contents:read זה המינימום שעדיין מאפשר checkout
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: backend

      - name: Test
        run: dotnet test ../backend.Tests/MyBackendApi.Tests.csproj -c Release
        working-directory: backend

      - name: Publish
        if: github.event_name == 'push'
        run: dotnet publish -c Release -o ./publish-output --no-build
        working-directory: backend

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend/publish-output

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: publish-output

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish-output

      # לא קריטי לדיפלוי עצמו (שכבר הצליח בשלב הקודם) - רק מעשיר תקריות
      # עתידיות בהקשר "מתי הדיפלוי האחרון קרה". retry כי מיד אחרי דיפלוי
      # ה-App Service עדיין מתעורר (עד ~90 שניות), ו-continue-on-error כדי
      # שכשל כאן לעולם לא יסמן את ה-workflow כולו כנכשל
      - name: Record deployment for incident correlation
        continue-on-error: true
        run: |
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors \
            -X POST "https://bugtracker-api-aharon-fuaucng8a3ckhqck.israelcentral-01.azurewebsites.net/api/deployments" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_LOG_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"component\":\"backend\",\"commitSha\":\"${{ github.sha }}\"}"
