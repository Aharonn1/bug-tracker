name: Frontend - Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

# pull-requests:write (לא רק contents:read) כי Azure/static-web-apps-deploy
# כותב בעצמו תגובת status על ה-PR עם קישור לסביבת ה-preview - contents:read
# גרידא היה שובר את זה
permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check
        run: npx tsc -b --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend'
          output_location: 'dist'

      # רק על push אמיתי ל-main - לא על כל PR preview environment. אותו
      # שיקול non-critical/retry כמו ב-backend-deploy.yml
      - name: Record deployment for incident correlation
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors \
            -X POST "https://bugtracker-api-aharon-fuaucng8a3ckhqck.israelcentral-01.azurewebsites.net/api/deployments" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_LOG_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"component\":\"frontend\",\"commitSha\":\"${{ github.sha }}\"}"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close PR environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
